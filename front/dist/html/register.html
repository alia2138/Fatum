<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | TaroPlatform</title>
    <link rel="stylesheet" href="../css/style.css?v=27">
</head>
<body>
<main class="card">
    <h1>Реєстрація</h1>
    <p class="subtitle">Створіть акаунт, щоб почати</p>

    <form id="register-form">
            Email
            <input type="email" name="email" required autocomplete="email">
        </label>

        <div class="form-row">
            <label>
                Я хочу бути
                <select name="role" id="role">
                    <option value="Client">Клієнтом</option>
                    <option value="Consultant">Тарологом</option>
                </select>
            </label>

            <label id="birth-date-field">
                Дата народження
                <input type="date" name="birthDate" autocomplete="bday">
            </label>
        </div>

        <label>
            Пароль
            <input type="password" name="password" required minlength="6" autocomplete="new-password">
        </label>

        <label>
            Повторіть пароль
            <input type="password" name="confirmPassword" required minlength="6" autocomplete="new-password">
        </label>

        <p id="error" class="error"></p>

        <button type="submit" id="submit" class="primary">Зареєструватися</button>
    </form>

    <div class="divider"><span>або</span></div>
    <div id="social-buttons" class="social"></div>

    <p class="switch">
        Вже є акаунт? <a href="login.html">Увійти</a>
    </p>
</main>
<script>
    window.socialConfig = {
        successType: "register",
        getRole: () => document.getElementById("role").value,
        getBirthDate: () => {
            if (document.getElementById("role").value !== "Client") return null;
            return document.querySelector('input[name="birthDate"]').value || null;
        },
        botName: "COURSACH_inator3000_bot", botId: ""
    };
</script>
<script src="../js/api.js?v=27"></script>
<script src="../js/social.js?v=27"></script>
<script src="../js/register.js?v=27"></script>
</body>
</html>
