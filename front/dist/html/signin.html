<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

</head>
<body>

<div class="background">

    <div class="background__circle background__circle--1"></div>
    <div class="background__circle background__circle--2"></div>
    <div class="background__circle background__circle--3"></div>

</div>


<main class="auth">

    <section class="auth-card">

        <div class="auth-card__logo">
            Auth<span>Flow</span>
        </div>

        <h1 class="auth-card__title">
            Welcome Back 👋
        </h1>

        <p class="auth-card__subtitle">
            Sign in to continue your journey.
        </p>

        <form class="form">

            <div class="input">

                <label>Email</label>

                <input
                        type="email"
                        placeholder="example@email.com">

            </div>


            <div class="input">

                <label>Password</label>

                <div class="input__password">

                    <input
                            type="password"
                            placeholder="••••••••">

                    <button
                            type="button"
                            class="input__eye">

                        👁

                    </button>

                </div>

            </div>


            <div class="form__options">

                <label class="checkbox">

                    <input type="checkbox">

                    <span>Remember me</span>

                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button class="btn">

                Sign In

            </button>

        </form>


        <div class="divider">

            <span>OR</span>

        </div>


        <div class="social">

            <button class="social__btn">

                Continue with Google

            </button>

            <button class="social__btn">

                Continue with GitHub

            </button>

        </div>


        <p class="auth-card__bottom">

            Don't have an account?

            <a href="register.html">

                Create account

            </a>

        </p>

    </section>

</main>

<script src="js/main.js"></script>

</body>
</html>
